[package]
name = "lyrics"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
libc = "0.2"
libpulse-binding = "2"
libpulse-simple-binding = "2"
miniz_oxide = "0.9"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
ureq = { version = "2", features = ["json"] }
zbus = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
