# Archivo de configuración para lyrics
#
# Ubicación por defecto de usuario: ~/.config/lyrics/config.conf (o lyrics.conf)
# Ubicación para paquetes (.deb/.rpm): /etc/lyrics/config.conf
#
# Formatos de color soportados:
#   - Hexadecimal: "#565f89", "565f89", "#fff"
#   - Decimal RGB: "86, 95, 137" o "rgb(86, 95, 137)"
#   - Nombres: "cyan", "white", "red", "green", "blue", "yellow", "magenta", "black", "gray"

# Color de las barras del espectro de audio (fondo y bloques en la terminal)
bar = "#565f89"

# Color de los botones multimedia (⏮, ⏭, ▶/⏸)
# Si no se especifica, toma automáticamente el color de "current"
buttons = "#00ffff"

# Color del corazón para canciones marcadas en Me gusta (Spotify)
heart = "#ff1e3c"

# Color de las letras previas (líneas ya reproducidas)
before = "#ffffff"

# Color de la letra actual (línea en reproducción)
current = "#00ffff"

# Color de las letras siguientes (líneas por reproducir)
after = "#414868"
